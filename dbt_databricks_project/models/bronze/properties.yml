version: 2

models:
  - name: bronze_date
    config:
      materialized: view
      schema: bronze

  - name: bronze_product
    config:
      materialized: view

  - name: bronze_sales
    columns:
      - name: sales_id
        tests:
          - unique
          - not_null

      - name: gross_amount
        tests:
          - generic_non_negative

    config:
      materialized: view

  - name: bronze_store
    columns:
      - name: country
        tests:
          - not_null
          - accepted_values:
              values: ['USA', 'Canada', 'Mexico']
              config:
                severity: warn
